services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - FRONTEND_URL=http://127.0.0.1:80
      - CORS_ORIGINS=http://127.0.0.1:80,http://localhost:80,http://127.0.0.1,http://localhost
    restart: unless-stopped
    networks:
      - telegram-dashboard

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://127.0.0.1:8000/api
        - VITE_TELEGRAM_BOT_USERNAME=${VITE_TELEGRAM_BOT_USERNAME:-your_bot_username}
        - VITE_AUTH_URL=http://127.0.0.1/bots
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./frontend/public/assets:/usr/share/nginx/assets
    restart: unless-stopped
    networks:
      - telegram-dashboard

networks:
  telegram-dashboard:
    driver: bridge
