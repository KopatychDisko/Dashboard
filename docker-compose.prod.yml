# Production override. Задайте переменные в .env перед запуском:
#   FRONTEND_URL, CORS_ORIGINS, VITE_API_URL, VITE_TELEGRAM_BOT_USERNAME, VITE_AUTH_URL

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:-${FRONTEND_URL}}
      - WORKERS=4
    restart: unless-stopped
    networks:
      - telegram-dashboard

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_TELEGRAM_BOT_USERNAME=${VITE_TELEGRAM_BOT_USERNAME}
        - VITE_AUTH_URL=${VITE_AUTH_URL}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend/public/assets:/usr/share/nginx/assets
    restart: unless-stopped
    networks:
      - telegram-dashboard

networks:
  telegram-dashboard:
    driver: bridge
